<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bizon365 → Google Sheets</title>
  <style>
    :root{color-scheme:dark;--bg:#060606;--panel:#101010;--line:#2d2d2d;--line-strong:#545454;--text:#f2f2f2;--muted:#bababa;--soft:#848484;--accent:#f4f4f4;--good:#79b98d;--bad:#df8585}
    *{box-sizing:border-box;scrollbar-width:none}::-webkit-scrollbar{display:none}
    html,body{width:100%;height:100%;min-height:0;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font:13px/1.4 "IBM Plex Sans","Segoe UI",system-ui,sans-serif}
    button,input{font:inherit;color:inherit}button{cursor:pointer}
    .app{height:100%;display:grid;grid-template-rows:40px 36px minmax(0,1fr);overflow:hidden}
    .top{height:40px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#0b0b0b;border-bottom:1px solid var(--line)}
    .brand{font-weight:650}.state{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);white-space:nowrap}
    .tabs{height:36px;padding:0 12px;display:flex;gap:2px;overflow:auto;background:#0b0b0b;border-bottom:1px solid var(--line)}
    .tab{height:35px;padding:0 10px;border:0;background:transparent;color:var(--muted);white-space:nowrap}.tab.active{background:var(--accent);color:#080808}
    .view{display:none;height:100%;min-height:0;overflow:auto}.view.active{display:grid}
    #events{grid-template-rows:auto auto minmax(0,1fr)}#settings{grid-template-rows:auto minmax(0,1fr) auto}
    .banner{padding:7px 12px;border-bottom:1px solid #665a37;background:#19170f;color:#d9c996;font-size:11px}
    .toolbar{min-height:48px;padding:8px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line)}
    .toolbar h2{font-size:13px;margin:0}.toolbar p{font-size:11px;margin:2px 0 0;color:var(--muted)}.actions{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.event-summary{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
    button{min-height:40px;padding:7px 11px;border:1px solid var(--line);border-radius:0;background:#171717}button:hover{background:#202020;border-color:var(--line-strong)}button:disabled{opacity:.45;cursor:default}button.primary{background:var(--accent);border-color:var(--accent);color:#080808;font-weight:650}
    .table{min-height:0;overflow:auto}.row{display:grid;grid-template-columns:65px 105px minmax(180px,1fr) 95px 70px 90px minmax(180px,1fr);gap:10px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--line)}.row.head{position:sticky;top:0;z-index:2;background:var(--panel);color:var(--muted);font-size:11px}
    .pill{display:inline-block;padding:2px 6px;border:1px solid var(--line);color:var(--muted);font-size:11px}.pill.ok{color:var(--good);border-color:#355441}.pill.bad{color:var(--bad);border-color:#593737}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere}.empty{padding:30px;text-align:center;color:var(--muted)}
    .settings-scroll{min-height:0;overflow:auto;padding:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 10px;max-width:920px}.field{display:grid;gap:4px}.field>span{font-size:11px;color:var(--muted)}.full{grid-column:1/-1}.input{width:100%;min-height:40px;padding:7px 8px;border:1px solid var(--line-strong);border-radius:0;background:#090909;outline:none}.input:focus{border-color:#888}.checks{display:flex;align-items:center;min-height:40px}.checks input{accent-color:#ddd}.status-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.status-item{display:flex;justify-content:space-between;gap:10px;padding:9px 10px;border:1px solid var(--line);background:var(--panel)}
    .internal-note{margin:0;padding:8px 10px;border-left:2px solid #718294;background:#101418;color:#b9c8d8;font-size:11px}.form-actions{padding:8px 12px;display:flex;justify-content:flex-end;border-top:1px solid var(--line);background:#101010}
    @media(max-width:720px){.app{grid-template-rows:44px 40px minmax(0,1fr)}.top{height:44px;padding:0 9px}.brand{font-size:12px}.state{font-size:10px}.tabs{height:40px;padding:0 6px}.tab{height:39px}.toolbar{align-items:flex-start;flex-direction:column;padding:9px}.actions{display:grid;grid-template-columns:1fr 1fr;justify-content:stretch;width:100%}.actions .primary{grid-column:1/-1}.row{grid-template-columns:1fr 1fr;gap:10px;padding:11px 9px}.row.head{display:none}.row>span{min-width:0;overflow-wrap:anywhere}.row>span::before{content:attr(data-label);display:block;margin-bottom:2px;color:var(--soft);font-size:10px;text-transform:uppercase;letter-spacing:.05em}.row .wide{grid-column:1/-1}.row .error-cell:empty{display:none}.grid,.status-grid{grid-template-columns:1fr}.full{grid-column:auto}.settings-scroll{padding:9px}.form-actions{padding:9px}.form-actions button{width:100%}}
  </style>
</head>
<body>
<div class="app">
  <div class="top"><div class="brand">Google Sheets</div><div id="status" class="state">Загрузка</div></div>
  <nav class="tabs"><button class="tab active" data-view="events">Журнал</button><button class="tab" data-view="settings">Настройки</button></nav>

  <section id="events" class="view active">
    <div id="dryBanner" class="banner">Dry-run включён: строки рассчитываются, таблица не изменяется.</div>
    <div class="toolbar"><div><h2>Выгрузка посещений</h2><div id="eventSummary" class="event-summary"></div></div><div class="actions"><select id="eventStatus" class="input" aria-label="Статус"><option value="">Все события</option><option value="failed">Ошибки</option><option value="received">Очередь</option><option value="success">Успешные</option><option value="shadow">Shadow</option></select><button id="replayShadow" type="button">Перенести shadow</button><button id="retry" type="button">Повторить 10</button><button id="sync" class="primary" type="button">Синхронизировать</button></div></div>
    <div class="table"><div class="row head"><span>ID</span><span>Статус</span><span>Attendance key</span><span>Nexus</span><span>Строка</span><span>Vakas</span><span>Ошибка</span></div><div id="eventsBody"></div></div>
  </section>

  <section id="settings" class="view">
    <div class="toolbar"><div><h2>Подключение</h2><p>Целевая вкладка создаётся автоматически.</p></div><button id="check" type="button">Проверить таблицу</button></div>
    <div class="settings-scroll"><div class="grid">
      <label class="field full"><span>Внутренний feed Bizon Reports</span><input id="feed_url" class="input mono"></label>
      <p class="internal-note full">Внутренний адрес Nexus.</p>
      <label class="field full"><span>Feed token</span><input id="feed_token" class="input mono" type="password" autocomplete="new-password" placeholder="Не менять"></label>
      <label class="field"><span>Spreadsheet ID</span><input id="spreadsheet_id" class="input mono"></label>
      <label class="field"><span>Название вкладки</span><input id="worksheet_title" class="input"></label>
      <label class="field"><span>Зеркальная вкладка Vakas</span><input id="vakas_worksheet_title" class="input"></label>
      <label class="field"><span>Интервал, секунд</span><input id="poll_seconds" class="input" type="number" min="5"></label>
      <label class="field"><span>Тайм-аут, секунд</span><input id="request_timeout" class="input" type="number" min="5"></label>
      <label class="field checks"><span><input id="dry_run" type="checkbox"> Dry-run</span></label>
      <label class="field checks"><span><input id="poll_enabled" type="checkbox"> Фоновая синхронизация</span></label>
      <label class="field checks"><span><input id="vakas_mirror_enabled" type="checkbox"> Дублировать новые строки в Vakas (A:W)</span></label>
      <div id="meta" class="status-grid full"></div>
    </div></div>
    <div class="form-actions"><button id="save" class="primary" type="button">Сохранить</button></div>
  </section>
</div>
<script>
const parts=location.pathname.split('/'),panelIndex=parts.indexOf('panel'),base=panelIndex>0?parts.slice(0,panelIndex).join('/'):'';
const API=base+'/api',$=id=>document.getElementById(id);
let settings={},eventCounts={};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const statusNames={success:'Успешно',failed:'Ошибка',received:'Очередь',shadow:'Shadow'};
const actionNames={created:'Добавлена',updated:'Обновлена',unchanged:'Без изменений',upsert:'Запись'};
async function api(path,opt){const response=await fetch(API+path,opt),data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.detail||data.error||'Ошибка');return data}
function note(message,level='log'){if(parent&&parent.notify)parent.notify(message,level);else console[level==='bad'?'error':'log'](message)}
function pill(text,kind=''){return `<span class="pill ${kind}">${esc(text)}</span>`}
function shortError(value){const text=String(value||'');const match=text.match(/Google Sheets HTTP \d+/);return match?match[0]:text.split('\n')[0].slice(0,180)}
function updateActionState(){
  const retryCount=(eventCounts.failed||0)+(eventCounts.received||0),shadowCount=eventCounts.shadow||0;
  $('retry').textContent=retryCount?`Повторить ${Math.min(10,retryCount)} из ${retryCount}`:'Ошибок нет';
  $('retry').disabled=!retryCount;
  $('replayShadow').textContent=shadowCount?`Перенести ${Math.min(10,shadowCount)} из ${shadowCount}`:'Shadow нет';
  $('replayShadow').disabled=!shadowCount||settings.dry_run;
  $('eventSummary').innerHTML=[
    pill(`Успешно ${eventCounts.success||0}`,'ok'),
    pill(`Ошибки ${eventCounts.failed||0}`,(eventCounts.failed||0)?'bad':''),
    pill(`Очередь ${eventCounts.received||0}`,(eventCounts.received||0)?'bad':''),
  ].join('');
}
async function loadSettings(){
  settings=await api('/settings');
  for(const key of ['feed_url','spreadsheet_id','worksheet_title','vakas_worksheet_title','poll_seconds','request_timeout'])$(key).value=settings[key]||'';
  $('feed_token').value='';
  $('feed_token').disabled=settings.feed_token_source==='env';
  $('feed_token').placeholder=settings.feed_token_source==='env'?'Задан в ENV':'Не менять';
  $('dry_run').checked=!!settings.dry_run;
  $('poll_enabled').checked=!!settings.poll_enabled;
  $('vakas_mirror_enabled').checked=!!settings.vakas_mirror_enabled;
  $('status').textContent=`${settings.feed_cursor||0} · ${settings.dry_run?'Dry-run':'Запись'} · ${settings.vakas_mirror_enabled?'Vakas':'Без Vakas'}`;
  $('dryBanner').style.display=settings.dry_run?'block':'none';
  $('meta').innerHTML=[
    ['Google',settings.credentials_configured],
    ['Feed',settings.feed_token_configured],
    ['Таблица',Boolean(settings.spreadsheet_id&&settings.worksheet_title)],
    ['Vakas',!settings.vakas_mirror_enabled||Boolean(settings.vakas_worksheet_title)],
  ].map(([label,ok])=>`<div class="status-item"><span>${esc(label)}</span>${pill(ok?'готово':'не настроено',ok?'ok':'bad')}</div>`).join('');
  updateActionState();
}
async function loadEvents(){
  $('eventsBody').innerHTML='<div class="empty">Загрузка событий</div>';
  try{
    const status=$('eventStatus').value;
    const data=await api(`/events?limit=180${status?`&status=${encodeURIComponent(status)}`:''}`);
    eventCounts=data.counts||{};
    const rows=data.items||[];
    $('eventsBody').innerHTML=rows.map(event=>{
      const error=shortError(event.error);
      return `<div class="row">
        <span data-label="ID">${esc(event.id)}</span>
        <span data-label="Статус">${pill(statusNames[event.status]||event.status,event.status==='success'?'ok':event.status==='failed'||event.status==='received'?'bad':'')}</span>
        <span data-label="Attendance key" class="mono wide">${esc(event.attendance_key)}</span>
        <span data-label="Nexus">${esc(actionNames[event.action]||event.action||'-')}</span>
        <span data-label="Строка">${esc(event.row_number||'-')}</span>
        <span data-label="Vakas">${esc(actionNames[event.vakas_action]||event.vakas_action||'-')} ${esc(event.vakas_row_number||'')}</span>
        <span data-label="Ошибка" class="error-cell wide" title="${esc(event.error||'')}">${esc(error)}</span>
      </div>`;
    }).join('')||'<div class="empty">Событий пока нет</div>';
    updateActionState();
  }catch(error){$('eventsBody').innerHTML=`<div class="empty">${esc(error.message)}</div>`;throw error}
}
async function runButton(button,loading,action){
  button.disabled=true;button.textContent=loading;
  try{return await action()}finally{button.disabled=false;updateActionState()}
}
$('save').onclick=()=>runButton($('save'),'Сохранение',async()=>{
  const body={};
  for(const key of ['feed_url','spreadsheet_id','worksheet_title','vakas_worksheet_title'])body[key]=$(key).value;
  const token=$('feed_token').value.trim();if(token)body.feed_token=token;
  body.poll_seconds=Number($('poll_seconds').value);body.request_timeout=Number($('request_timeout').value);
  body.dry_run=$('dry_run').checked;body.poll_enabled=$('poll_enabled').checked;body.vakas_mirror_enabled=$('vakas_mirror_enabled').checked;
  await api('/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});await loadSettings();note('Настройки сохранены','ok');
}).catch(error=>note(error.message,'bad'));
$('sync').onclick=()=>runButton($('sync'),'Синхронизация',async()=>{await api('/sync/run',{method:'POST'});await Promise.all([loadSettings(),loadEvents()]);note('Синхронизация завершена','ok')}).catch(error=>note(error.message,'bad'));
$('retry').onclick=async()=>{
  const count=(eventCounts.failed||0)+(eventCounts.received||0),batch=Math.min(10,count);if(!batch)return;
  if(!confirm(`Повторить ${batch} событий?`))return;
  runButton($('retry'),'Обработка',async()=>{const result=await api('/events/retry?limit=10',{method:'POST'});await loadEvents();note(`Обработано: ${result.processed}, ошибок: ${result.failed}`,result.failed?'bad':'ok')}).catch(error=>note(error.message,'bad'));
};
$('check').onclick=()=>runButton($('check'),'Проверка',async()=>{await api('/sheet/check',{method:'POST'});note('Таблица доступна','ok')}).catch(error=>note(error.message,'bad'));
$('replayShadow').onclick=async()=>{
  const count=eventCounts.shadow||0,batch=Math.min(10,count);if(!batch||settings.dry_run)return;
  if(!confirm(`Перенести ${batch} shadow-событий?`))return;
  runButton($('replayShadow'),'Обработка',async()=>{const result=await api('/events/retry?include_shadow=1&limit=10',{method:'POST'});await loadEvents();note(`Обработано: ${result.processed}, ошибок: ${result.failed}`,result.failed?'bad':'ok')}).catch(error=>note(error.message,'bad'));
};
$('eventStatus').onchange=()=>loadEvents().catch(error=>note(error.message,'bad'));
document.querySelectorAll('.tab').forEach(tab=>tab.onclick=()=>{document.querySelectorAll('.tab').forEach(item=>item.classList.remove('active'));document.querySelectorAll('.view').forEach(view=>view.classList.remove('active'));tab.classList.add('active');$(tab.dataset.view).classList.add('active')});
Promise.all([loadSettings(),loadEvents()]).catch(error=>note(error.message,'bad'));
</script>
</body>
</html>
