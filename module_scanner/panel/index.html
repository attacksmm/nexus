<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Сканер</title>
  <style>
    :root{color-scheme:dark;--bg:#060606;--panel:#101010;--panel2:#171717;--line:#2d2d2d;--line2:#444;--text:#f2f2f2;--muted:#aaa;--subtle:#777;--ok:#9fe0aa;--bad:#ffc2ca;--warn:#ffe08a;--info:#9fd4ff;font-family:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;font-size:13px}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text)}button{font:inherit}
    *{scrollbar-color:#555 #080808;scrollbar-width:thin}::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:#080808}::-webkit-scrollbar-thumb{background:#555;border:2px solid #080808}
    .shell{width:100vw;height:100vh;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;overflow:hidden}
    .top{display:flex;align-items:center;gap:8px;min-width:0;padding:9px 10px;border-bottom:1px solid var(--line);background:var(--panel)}
    .title{font-weight:650;font-size:.98rem;white-space:nowrap}.spacer{flex:1}
    .tabs{display:flex;gap:6px;min-width:0;overflow:auto;padding:8px 10px;border-bottom:1px solid var(--line);background:#090909}
    .tab,.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:30px;border:1px solid var(--line2);background:var(--panel2);color:var(--text);padding:5px 10px;cursor:pointer;white-space:nowrap}
    .tab.active,.btn.primary{background:#f4f4f4;color:#080808;border-color:#f4f4f4}.btn.ghost{background:transparent;color:var(--muted);border-color:var(--line)}.btn:disabled{opacity:.45;cursor:default}
    .pill{display:inline-flex;align-items:center;min-height:24px;padding:3px 8px;border:1px solid var(--line);background:#0b0b0b;color:var(--muted);font-size:.78rem;white-space:nowrap}.pill.bad{color:var(--bad);border-color:#69323a;background:#231013}.pill.ok{color:var(--ok);border-color:#2e6040;background:#102116}.pill.warn{color:var(--warn);border-color:#665524;background:#211c0b}
    .content{min-height:0;overflow:auto}.empty{height:100%;display:grid;place-items:center;color:var(--subtle);padding:28px;text-align:center}
    table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:.82rem}th,td{height:38px;padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}th{position:sticky;top:0;z-index:2;background:var(--panel);color:var(--subtle);font-weight:500}tr:hover td{background:var(--panel2)}tr.read td{opacity:.62}.c-status{width:145px}.c-id{width:118px}.c-name{width:180px}.c-date{width:150px}.c-admin{width:150px}.c-actions{width:92px;text-align:right}.preview{white-space:normal;line-height:1.35;max-height:42px;overflow:hidden}.mono{font-family:"IBM Plex Mono","Consolas",monospace}
    .status{height:30px;display:flex;align-items:center;gap:10px;padding:0 10px;border-top:1px solid var(--line);background:var(--panel);color:var(--subtle);font-size:.78rem;min-width:0}.status span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    @media(max-width:820px){.top{flex-wrap:wrap}.c-name,.c-admin{display:none}th.c-name,td.c-name,th.c-admin,td.c-admin{display:none}.c-date{width:126px}.c-status{width:128px}}
  </style>
</head>
<body>
<div class="shell">
  <div class="top">
    <div class="title">Сканер</div>
    <span id="summary" class="pill">—</span>
    <span id="config" class="pill">—</span>
    <div class="spacer"></div>
    <button id="refreshBtn" class="btn ghost" type="button">Обновить</button>
    <button id="scanBtn" class="btn primary" type="button">Проверить сейчас</button>
  </div>
  <div class="tabs">
    <button class="tab active" data-tab="problems" type="button">Не отвечено <span id="countProblems" class="pill bad">0</span></button>
    <button class="tab" data-tab="admin" type="button">Общение с админом <span id="countAdmin" class="pill warn">0</span></button>
    <button class="tab" data-tab="all" type="button">Все</button>
    <button id="toggleRead" class="tab" type="button">Новые</button>
  </div>
  <div class="content">
    <table>
      <thead>
        <tr>
          <th class="c-status">Статус</th>
          <th class="c-id">VK ID</th>
          <th class="c-name">Имя</th>
          <th class="c-date">Сообщение</th>
          <th>Текст</th>
          <th class="c-admin">Админ</th>
          <th class="c-actions"></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty" class="empty" hidden>Список пуст</div>
  </div>
  <div class="status">
    <span id="left">Готово</span>
    <span id="msg" style="margin-left:auto"></span>
  </div>
</div>
<script>
const API = location.pathname.replace(/\/panel\/.*$/, '/api');
const state = {tab:'problems', unread:true, data:null};
const $ = id => document.getElementById(id);
function esc(s){return String(s ?? '').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function fmtDate(s){if(!s)return '—';const d=new Date(s);return Number.isNaN(d.getTime())?s:d.toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});}
function statusLabel(s){return ({missing_webhook:'нет webhook',missing_human_reply:'нет ответа ОП',admin_conversation:'общение с админом',pending_sla:'ожидание SLA',pending_human_response:'ожидает ОП',answered_by_openrouter:'ответ есть',resolved_not_unanswered:'закрыто в VK',ignored_non_text:'вложение'})[s] || s || '—';}
function statusClass(s){if(s==='missing_webhook'||s==='missing_human_reply')return 'bad';if(s==='admin_conversation'||s==='pending_sla'||s==='pending_human_response')return 'warn';return 'ok';}
async function api(path, opts={}){
  const res = await fetch(API + path, opts);
  if(!res.ok){let data={};try{data=await res.json()}catch{};throw new Error(data.detail||data.error||`HTTP ${res.status}`)}
  return await res.json();
}
function setMsg(text, kind='info'){$('msg').textContent=text||'';$('msg').style.color=kind==='error'?'var(--bad)':kind==='ok'?'var(--ok)':'var(--subtle)';}
function count(status){const c=(state.data?.counts||{})[status]||{};return Number(c.unread||0);}
function render(){
  const data = state.data || {items:[],counts:{},enabled:false};
  const problemCount = count('missing_webhook') + count('missing_human_reply');
  const adminCount = count('admin_conversation');
  $('countProblems').textContent = String(problemCount);
  $('countAdmin').textContent = String(adminCount);
  $('summary').className = 'pill ' + (problemCount ? 'bad' : 'ok');
  $('summary').textContent = problemCount ? `проблем: ${problemCount}` : `проблем нет`;
  $('config').className = 'pill ' + (data.enabled ? 'ok' : 'bad');
  $('config').textContent = data.enabled ? `SLA ${data.sla_seconds || 0}с, проверка ${data.poll_seconds || 0}с` : 'сканер выключен';
  $('toggleRead').textContent = state.unread ? 'Новые' : 'Все записи';
  const rows = data.items || [];
  $('rows').innerHTML = rows.map(row => {
    const cls = statusClass(row.status);
    const read = row.read_at ? 'read' : '';
    const adminAt = row.admin_before_at || row.admin_after_at || '';
    return `<tr class="${read}" title="${esc(row.reason || '')}">
      <td class="c-status"><span class="pill ${cls}">${esc(statusLabel(row.status))}</span></td>
      <td class="c-id mono">${esc(row.vk_user_id)}</td>
      <td class="c-name">${esc(row.profile_name || '—')}</td>
      <td class="c-date">${esc(fmtDate(row.message_at))}</td>
      <td><div class="preview">${esc(row.message_text_preview || '—')}</div></td>
      <td class="c-admin">${esc(fmtDate(adminAt))}</td>
      <td class="c-actions"><button class="btn ghost open" data-id="${esc(row.id)}" type="button">VK</button></td>
    </tr>`;
  }).join('');
  $('empty').hidden = rows.length > 0;
  $('left').textContent = `Показано ${rows.length} из 20`;
}
async function load(){
  const data = await api(`/events?tab=${encodeURIComponent(state.tab)}&unread=${state.unread?1:0}&limit=20`);
  state.data = data;
  render();
}
async function scanNow(){
  $('scanBtn').disabled = true;
  try{
    const data = await api('/scan', {method:'POST'});
    state.data = data.events || null;
    render();
    setMsg(`Проверка: найдено ${data.vk_unanswered_seen || 0}`, 'ok');
  }finally{
    $('scanBtn').disabled = false;
  }
}
document.querySelectorAll('.tab[data-tab]').forEach(btn=>btn.addEventListener('click',()=>{
  document.querySelectorAll('.tab[data-tab]').forEach(x=>x.classList.toggle('active', x===btn));
  state.tab = btn.dataset.tab;
  load().catch(e=>setMsg(e.message,'error'));
}));
$('toggleRead').addEventListener('click',()=>{state.unread=!state.unread;load().catch(e=>setMsg(e.message,'error'));});
$('refreshBtn').addEventListener('click',()=>load().catch(e=>setMsg(e.message,'error')));
$('scanBtn').addEventListener('click',()=>scanNow().catch(e=>setMsg(e.message,'error')));
$('rows').addEventListener('click', async e=>{
  const btn = e.target.closest('.open');
  if(!btn)return;
  btn.disabled = true;
  try{
    const data = await api(`/events/${encodeURIComponent(btn.dataset.id)}/open`, {method:'POST'});
    if(data.url) window.open(data.url, '_blank', 'noopener');
    await load();
  }catch(err){
    setMsg(err.message,'error');
  }finally{
    btn.disabled = false;
  }
});
load().catch(e=>setMsg(e.message,'error'));
</script>
</body>
</html>
