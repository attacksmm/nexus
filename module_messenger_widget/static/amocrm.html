  function templateSettings(){const box=$('templateSettings');box.hidden=false;async function list(){box.innerHTML='<div class="settings-head"><button class="tool" type="button">Новый личный шаблон</button><button class="tool" type="button">Импорт из amoCRM</button><button class="tool" type="button">Закрыть</button></div><div id="templateList" class="template-list"><div class="loading-state"><span class="spinner" aria-hidden="true"></span>Загружаем шаблоны…</div></div>';const [add,importButton,back]=box.querySelectorAll('button');add.onclick=()=>editor();importButton.disabled=true;importButton.onclick=async()=>{if(!confirm('Импортировать шаблоны amoCRM как общие?'))return;importButton.disabled=true;importButton.classList.add('busy');importButton.textContent='Импортируем…';try{const result=await importAmoTemplates(await readAmoTemplates());alert('Импортировано: '+result.imported+' · Пропущено: '+result.skipped+' · Ошибки: '+result.invalid+(result.with_buttons||result.with_attachments?' · Кнопки и файлы не переносились':''));templatesLoadedAt=0;await list()}catch(error){alert(error.message||'Не удалось импортировать шаблоны')}finally{if(importButton.isConnected){importButton.disabled=false;importButton.classList.remove('busy');importButton.textContent='Импорт из amoCRM'}}};back.onclick=settings;try{const data=await loadTemplates(),list=box.querySelector('#templateList');if(!list)return;importButton.hidden=!data.can_manage_shared;importButton.disabled=!data.can_manage_shared;list.innerHTML='';if(!templates.length)list.innerHTML='<div class="empty">Шаблонов пока нет</div>';let rendered=0;for(const row of templates){const item=document.createElement('div'),copy=document.createElement('div'),title=document.createElement('b'),preview=document.createElement('small'),actions=document.createElement('div'),star=document.createElement('button');item.className='template-row';title.textContent=row.scope==='personal'?'Личный · '+row.title:'Общий · '+(row.folder||'Без папки')+' · '     function editor(row=null,canShared=false){const current=row||{scope:'personal',folder:'',title:'',body:''};box.innerHTML='<div class="settings-head"><button class="tool" type="button">← Шаблоны</button></div><form class="editor"><label>Тип<select name="scope"><option value="personal">Личный</option><option value="shared">Общий</option></select></label><label class="folder-field">Папка<input name="folder" maxlength="120"></label><label>Название<input name="title" maxlength="120" required></label><label>Содержание<textarea name="body" maxlength="20000" required></textarea></label><div class="variable-list"></div><div class="settings-actions"><button class="tool" type="submit">Сохранить</button></div></form>';const form=box.querySelector('form'),scope=form.elements.scope;scope.value=current.scope;scope.disabled=!!row;scope.querySelector('[value="shared"]').disabled=!canShared;if(!canShared&&scope.value==='shared')scope.value='personal';const syncFolder=()=>{form.querySelector('.folder-field').hidden=scope.value==='personal';if(scope.value==='personal')form.elements.folder.value=''};scope.onchange=syncFolder;form.elements.folder.value=current.folder||'';syncFolder();form.elements.title.value=current.title||'';form.elements.body.value=current.body||'';templateVariables.forEach(item=>{const insert=document.createElement('button');insert.type='button';insert.className='tool';insert.textContent=item.label+' · {{'+item.key+'}}';insert.onclick=()=>{const area=form.elements.body,marker='{{'+item.key+'}}';area.setRangeText(marker,area.selectionStart,area.selectionEnd,'end');area.focus()};form.querySelector('.variable-list').append(insert)});box.querySelector('.settings-head button').onclick=list;if(row){const del=document.createElement('button');del.type='button';del.className='tool danger';del.textContent='Удалить';del.onclick=async()=>{if(confirm('Удалить шаблон «'+row.title+'»?')){await request('/templates',{action:'delete',id:row.id,scope:row.scope});templatesLoadedAt=0     list()}
