  function messageNode(row){const wrap=document.createElement('div'),bubble=document.createElement('div'),meta=document.createElement('small');wrap.className='msg '+(row.direction==='outgoing'?'outgoing':'');bubble.className='bubble';const files=row.attachments?.length?row.attachments:[{content_uri:row.content_uri}];for(const file of files){if(!/^https:\/\//i.test(file.content_uri||''))continue;const link=document.createElement('a');link.href=file.content_uri;link.target='_blank';link.rel='noopener noreferrer';link.textContent=file.filename||'Открыть вложение';link.style.display='block';bubble.append(link)}bubble.append(document.createTextNode(row.text||'Сообщение'));meta.textContent=[row.author_name,formatTime(row.sent_at),row.status].filter(Boolean).join(' · ');bubble.append(meta);wrap.append(bubble);return wrap}
  function renderMessages(data,prepend){const rows=data.messages||[],feed=$('feed'),signature=JSON.stringify([data.history_status,data.can_send,data.send_reason,rows.map(row=>[row.external_id,row.status,row.text,row.sent_at])]);nextOffset=Number(data.next_offset)||0;hasMore=!!data.has_more;if(prepend){const before=feed.scrollHeight,anchor=feed.firstChild;rows.forEach(row=>feed.insertBefore(messageNode(row),anchor));feed.scrollTop=Math.max(1,feed.scrollHeight-before);return}if(signature===messageSignature)return;messageSignature=signature;feed.innerHTML='';const statusText={syncing:'Загружаем историю. Можно писать.',no_access:'Нет доступа к чатам Wazzup. Назначьте сотруднику роль «Руководитель».',error:'Wazzup не отдал историю. Повторите позже.',not_found:'Диалог не найден. Можно начать ниже.',not_started:'Истории с сообществом нет.'}[data.history_status];if(statusText){const note=document.createElement('div');note.className='note';note.textContent=statusText;feed.append(note)}if(data.send_reason){const note=document.createElement('div');note.className='note';note.textContent=data.send_reason;feed.append(note)}rows.forEach(row=>feed.append(messageNode(row)));if(!rows.length)feed.insertAdjacentHTML('beforeend','<div class="empty">'+(data.can_send===false?'Канал недоступен':'Сообщений пока нет. Можно написать ниже.')+'</div>');feed.scrollTop=feed.scrollHeight}
  async function refreshActive(force=false){if(!active||active.provider==='salebot'&&!force||polling&&!force||document.hidden||!$('templateSettings').hidden)return;const row=active,key=conversationKey(row),generation=channelGeneration;polling=true;try{const data=await request('/conversation',channelBody(row));if(active!==row||generation!==channelGeneration)return;rememberConversation(key,data);renderMessages(data,false);$('send').disabled=data.can_send===false;$('message').disabled=data.can_send===false}catch(_){ }finally{polling=false}}
  async function loadOlder(){if(!active||!hasMore||loadingOlder||!nextOffset)return;loadingOlder=true;try{renderMessages(await request('/conversation',channelBody(active,nextOffset)),true)}catch(error){showError(error.message)}finally{loadingOlder=false}}
  async function loadTemplates(){const data=await request('/templates',{action:'list'});templates=data.templates||[];templateVariables=data.variables||[];return data}
  function menuButton(label,action,small=''){const button=document.createElement('button');button.type='button';button.textContent=label;if(small){const preview=document.createElement('small');preview.textContent=small;button.append(preview)}button.onclick=event=>{event.preventDefault();event.stopPropagation();action();if(!$('moreMenu').hidden)placeMenu()};$('moreMenu').append(button);return button}
  function templateMenu(scope,folder){$('moreMenu').innerHTML='';menuButton('← Назад',()=>templateRoot());const rows=templates.filter(row=>row.scope===scope);if(folder===undefined){const folders=[...new Set(rows.map(row=>row.folder||'Без папки'))];if(!folders.length)$('moreMenu').insertAdjacentHTML('beforeend','<div class="empty">Шаблонов нет</div>');folders.forEach(name=>menuButton(name,()=>templateMenu(scope,name)));return}rows.filter(row=>(row.folder||'Без папки')===folder).forEach(row=>menuButton(row.title,()=>applyTemplate(row),String(row.body||'').replace(/\s+/g,' ').slice(0,90)))}
  function templateRoot(){$('moreMenu').innerHTML='';menuButton('← Действия',rootMenu);menuButton('Общие',()=>templateMenu('shared'));menuButton('Личные',()=>templateMenu('personal'))}
  function rootMenu(){$('moreMenu').innerHTML='';menuButton('Шаблон',templateRoot);menuButton('Вложение',()=>{const url=prompt('HTTPS-ссылка на файл:',$('message').dataset.attachmentUrl||'');if(url===null)return;if(url&&!/^https:\/\//i.test(url.trim()))return showError('Нужна HTTPS-ссылка');$('message').dataset.attachmentUrl=url.trim();$('message').dataset.attachmentType=url?(prompt('Тип: image, video, audio или document:','document')||'document').trim():'';$('more').title=url?'Вложение добавлено':'';$('moreMenu').hidden=true})}
  function placeMenu(){const button=$('more').getBoundingClientRect(),menu=$('moreMenu');$('more').parentElement.classList.toggle('open-up',button.top>innerHeight-button.bottom);menu.style.transform='';const box=menu.getBoundingClientRect(),shift=box.left<8?8-box.left:box.right>innerWidth-8?innerWidth-8-box.right:0;if(shift)menu.style.transform=`translateX(${shift}px)`}
  const channelLabel=row=>String(row.label||row.name||row.transport||'Канал').split(' · ')[0];
  async function sendText(raw,rows,attachment){const targets=rows.filter(row=>row&&row.can_send!==false);if(!targets.length)throw new Error('Нет доступных каналов');const preview=raw?await request('/template-preview',{body:raw,...threadFields()}):{text:''};const sent=[],failed=[];for(const row of targets){if(attachment.attachment_url&&row.provider!=='salebot'){failed.push(channelLabel(row)+': вложения поддерживает SaleBot');continue}try{const result=await request('/send',{...channelBody(row),text:preview.text,...attachment});if(result.sent===false)failed.push(channelLabel(row)+(result.notice?': '+result.notice:''));else sent.push(channelLabel(row))}catch(error){failed.push(channelLabel(row)+': '+(error.message||'ошибка'))}}return{sent,status:[sent.length?'Отправлено: '+sent.join(', '):'',failed.length?'Не отправлено: '+failed.join('; '):''].filter(Boolean).join(' · ')}}
  async function applyTemplate(row){try{const data=await request('/template-preview',{id:Number(row.id)});$('message').value=data.text||'';showError('')}catch(error){showError(error.message)}finally{$('moreMenu').hidden=true}}
  function settings(){const box=$('templateSettings'),prefs=applyPrefs();box.hidden=false;$('title').textContent='Настройки';box.innerHTML='<div class="settings-panel"><div class="settings-head"><button class="tool templates" type="button">Шаблоны</button><button class="tool close-settings" type="button">Закрыть</button></div><div class="field">Размер виджета<div class="choices size"></div></div><div class="field">Тема<div class="choices themes"></div></div><div class="field">Палитра<div class="palettes"></div></div><label class="field">Цвет<input class="color" type="color" value="'+prefs.color+'"></label><button class="tool reset" type="button">Сбросить</button></div>';box.querySelector('.templates').onclick=templateSettings;box.querySelector('.close-settings').onclick=()=>{box.hidden=true;$('title').textContent='Диалоги'};[['small','Маленький'],['medium','Средний'],['large','Большой']].forEach(([value,label])=>{const button=document.createElement('button');button.type='button';button.textContent=label;button.className=value===prefs.size?'active':'';button.onclick=()=>{savePrefs({size:value});settings()};box.querySelector('.size').append(button)});[['light','Светлая'],['dark','Тёмная']].forEach(([value,label])=>{const button=document.createElement('button');button.type='button';button.textContent=label;button.className=value===prefs.theme?'active':'';button.onclick=()=>{savePrefs({theme:value});settings()};box.querySelector('.themes').append(button)});palettes.forEach(color=>{const button=document.createElement('button');button.type='button';button.className='palette'+(prefs.color.toLowerCase()===color?' active':'');button.style.background=color;button.setAttribute('aria-label',color);button.onclick=()=>{savePrefs({color});settings()};box.querySelector('.palettes').append(button)});box.querySelector('.color').oninput=event=>savePrefs({color:event.target.value});box.querySelector('.reset').onclick=()=>{localStorage.removeItem(prefsKey());settings()}}
  function templateSettings(){const box=$('templateSettings');box.hidden=false;$('title').textContent='Шаблоны';async function list(){box.innerHTML='<div class="settings-head"><button class="tool" type="button">Создать</button><button class="tool" type="button">Импорт из amoCRM</button><button class="tool" type="button">Закрыть</button></div><div id="templateList" class="template-list"><div class="empty">Загрузка…</div></div>';const [add,importButton,back]=box.querySelectorAll('button');add.onclick=()=>editor();importButton.disabled=true;importButton.onclick=async()=>{if(!confirm('Импортировать шаблоны amoCRM как общие?'))return;importButton.disabled=true;try{const result=await importAmoTemplates(await readAmoTemplates());alert('Импортировано: '+result.imported+' · Пропущено: '+result.skipped+' · Ошибки: '+result.invalid+(result.with_buttons||result.with_attachments?' · Кнопки и файлы не переносились':''));await list()}catch(error){alert(error.message||'Не удалось импортировать шаблоны')}finally{if(importButton.isConnected)importButton.disabled=false}};back.onclick=settings;try{const data=await loadTemplates(),list=box.querySelector('#templateList');if(!list)return;importButton.hidden=!data.can_manage_shared;importButton.disabled=!data.can_manage_shared;list.innerHTML='';if(!templates.length)list.innerHTML='<div class="empty">Шаблонов пока нет</div>';templates.forEach(row=>{const item=document.createElement('div'),copy=document.createElement('div'),title=document.createElement('b'),preview=document.createElement('small');item.className='template-row';title.textContent=(row.scope==='personal'?'Личные':'Общие')+' · '+(row.folder||'Без папки')+' · '+row.title;preview.textContent=String(row.body||'').replace(/\s+/g,' ');copy.append(title,preview);item.append(copy);if(row.editable){const edit=document.createElement('button');edit.className='tool';edit.textContent='Изменить';edit.onclick=()=>editor(row,data.can_manage_shared);item.append(edit)}list.append(item)})}catch(error){const list=box.querySelector('#templateList');if(list)list.textContent=error.message}}
    function editor(row=null,canShared=false){const current=row||{scope:'personal',folder:'',title:'',body:''};box.innerHTML='<div class="settings-head"><button class="tool" type="button">← Шаблоны</button></div><form class="editor"><label>Тип<select name="scope"><option value="personal">Личный</option><option value="shared">Общий</option></select></label><label>Папка<input name="folder" maxlength="120"></label><label>Название<input name="title" maxlength="120" required></label><label>Содержание<textarea name="body" maxlength="20000" required></textarea></label><div class="variable-list"></div><div class="settings-actions"><button class="tool" type="submit">Сохранить</button></div></form>';const form=box.querySelector('form'),scope=form.elements.scope;scope.value=current.scope;scope.disabled=!!row;scope.querySelector('[value="shared"]').disabled=!canShared;if(!canShared&&scope.value==='shared')scope.value='personal';form.elements.folder.value=current.folder||'';form.elements.title.value=current.title||'';form.elements.body.value=current.body||'';templateVariables.forEach(item=>{const insert=document.createElement('button');insert.type='button';insert.className='tool';insert.textContent=item.label+' · {{'+item.key+'}}';insert.onclick=()=>{const area=form.elements.body,marker='{{'+item.key+'}}';area.setRangeText(marker,area.selectionStart,area.selectionEnd,'end');area.focus()};form.querySelector('.variable-list').append(insert)});box.querySelector('.settings-head button').onclick=list;if(row){const del=document.createElement('button');del.type='button';del.className='tool danger';del.textContent='Удалить';del.onclick=async()=>{if(confirm('Удалить шаблон «'+row.title+'»?')){await request('/templates',{action:'delete',id:row.id,scope:row.scope});list()}};form.querySelector('.settings-actions').append(del)}form.onsubmit=async event=>{event.preventDefault();try{await request('/templates',{action:row?'update':'create',id:row&&row.id,scope:scope.value,folder:form.elements.folder.value.trim(),title:form.elements.title.value.trim(),body:form.elements.body.value.trim()});list()}catch(error){showError(error.message)}}}
    list()}
  $('feed').onscroll=()=>{if($('feed').scrollTop<40)loadOlder()};wheelX($('channels'));wheelY($('feed'));wheelY($('threads'));$('filter').onclick=()=>{$('filterMenu').hidden=!$('filterMenu').hidden};$('search').oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(loadInbox,250)};$('more').onclick=()=>{$('moreMenu').hidden=!$('moreMenu').hidden;if(!$('moreMenu').hidden){rootMenu();placeMenu()}};$('file').onchange=()=>{$('more').title=$('file').files[0]?'Файл: '+$('file').files[0].name:'';$('moreMenu').hidden=true};$('mobileDialogs').onclick=()=>$('app').classList.add('mobile-inbox');$('mobileClose').onclick=()=>parent.postMessage({type:'nexus-messenger-close'},'*');$('settings').onclick=settings;$('close').onclick=()=>parent.postMessage({type:'nexus-messenger-close'},'*');
  $('authClose').onclick=()=>parent.postMessage({type:'nexus-messenger-close'},'*');$('authForm').onsubmit=async event=>{event.preventDefault();$('authError').textContent='';try{const data=await request('/activate',{code:$('code').value.trim()});token=data.device_token;localStorage.setItem(storageKey(),token);await boot()}catch(error){$('authError').textContent=error.message}};$('send').onclick=async()=>{const text=$('message').value.trim(),attachment={attachment_url:$('message').dataset.attachmentUrl||'',attachment_type:$('message').dataset.attachmentType||''};if(!text&&!attachment.attachment_url||!active)return;$('send').disabled=true;$('send').textContent='Отправка…';try{const result=await sendText(text,$('sendAll').checked?cardChannels:[active],attachment);if(result.sent.length){$('message').value='';delete $('message').dataset.attachmentUrl;delete $('message').dataset.attachmentType;$('more').title=''}messageSignature='';await Promise.all([refreshActive(true),loadInbox()]);showError(result.status)}catch(error){showError(error.message)}finally{$('send').textContent='Отправить';if(!$('message').disabled)$('send').disabled=false}};$('refresh').onclick=()=>Promise.all([loadInboxChannels(),loadInbox(),refreshActive(true)]).catch(error=>showError(error.message));setInterval(refreshActive,5000);addEventListener('resize',()=>showActiveChannel());addEventListener('message',event=>{if(event.source!==parent||!event.data||event.data.type!=='nexus-messenger-context')return;context=event.data.context;boot()});parent.postMessage({type:'nexus-messenger-ready'},'*');
