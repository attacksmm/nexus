    function editor(row=null,canShared=false){const current=row||{scope:'personal',folder:'',title:'',body:''};box.innerHTML='<div class="settings-head"><button class="tool" type="button">← Шаблоны</button></div><form class="editor"><label>Тип<select name="scope"><option value="personal">Личный</option><option value="shared">Общий</option></select></label><label class="folder-field">Папка<input name="folder" maxlength="120"></label><label>Название<input name="title" maxlength="120" required></label><label>Содержание<textarea name="body" maxlength="20000" required></textarea></label><div class="variable-list"></div><div class="settings-actions"><button class="tool" type="submit">Сохранить</button></div></form>';const form=box.querySelector('form'),scope=form.elements.scope;scope.value=current.scope;scope.disabled=!!row;scope.querySelector('[value="shared"]').disabled=!canShared;if(!canShared&&scope.value==='shared')scope.value='personal';const syncFolder=()=>{form.querySelector('.folder-field').hidden=scope.value==='personal';if(scope.value==='personal')form.elements.folder.value=''};scope.onchange=syncFolder;form.elements.folder.value=current.folder||'';syncFolder();form.elements.title.value=current.title||'';form.elements.body.value=current.body||'';templateVariables.forEach(item=>{const insert=document.createElement('button');insert.type='button';insert.className='tool';insert.textContent=item.label+' · {{'+item.key+'}}';insert.onclick=()=>{const area=form.elements.body,marker='{{'+item.key+'}}';area.setRangeText(marker,area.selectionStart,area.selectionEnd,'end');area.focus()};form.querySelector('.variable-list').append(insert)});box.querySelector('.settings-head button').onclick=list;if(row){const del=document.createElement('button');del.type='button';del.className='tool danger';del.textContent='Удалить';del.onclick=async()=>{if(confirm('Удалить шаблон «'+row.title+'»?')){await request('/templates',{action:'delete',id:row.id,scope:row.scope});templatesLoadedAt=0;list()}};form.querySelector('.settings-actions').append(del)}form.onsubmit=async event=>{event.preventDefault();const save=form.querySelector('[type="submit"]'),label=save.textContent;save.disabled=true;save.classList.add('busy');save.textContent='Сохраняем…';try{await request('/templates',{action:row?'update':'create',id:row&&row.id,scope:scope.value,folder:scope.value==='personal'?'':form.elements.folder.value.trim(),title:form.elements.title.value.trim(),body:form.elements.body.value.trim()});templatesLoadedAt=0;list()}catch(error){showError(error.message);save.disabled=false;save.classList.remove('busy');save.textContent=label}}}
    list()}
  const visualSettings=settings;settings=()=>{visualSettings();const toolbar=$('templateSettings').querySelector('.settings-head');if(toolbar&&!toolbar.querySelector('.notifications')){const button=document.createElement('button');button.type='button';button.className='tool notifications';button.textContent='Уведомления';button.onclick=notificationSettings;toolbar.prepend(button)}};
  $('feed').onscroll=()=>{if($('feed').scrollTop<40)loadOlder()};wheelX($('channels'));wheelX($('profileLinks'));wheelY($('feed'));$('message').addEventListener('input',sizeMessageInput);sizeMessageInput();$('more').onclick=()=>{$('moreMenu').hidden=!$('moreMenu').hidden;if(!$('moreMenu').hidden){rootMenu();placeMenu()}};$('file').onchange=()=>{$('more').title=$('file').files[0]?'Файл: '+$('file').files[0].name:'';$('moreMenu').hidden=true};$('settings').onclick=settings;$('close').onclick=()=>parent.postMessage({type:'nexus-messenger-close'},'*');$('templateSettings').addEventListener('submit',event=>{const scope=event.target.elements?.scope,folder=event.target.elements?.folder;if(scope?.value==='personal'&&folder)folder.value=''},true);new MutationObserver(()=>{$('templateSettings').querySelectorAll('.template-row b').forEach(node=>{node.textContent=node.textContent.replace(/^Личные · Без папки · /,'Личный · ')})}).observe($('templateSettings'),{childList:true,subtree:true});
  $('help').onclick=$('authHelp').onclick=()=>window.open(GUIDE,'_blank','noopener');
  $('authClose').onclick=()=>parent.postMessage({type:'nexus-messenger-close'},'*');
  $('authForm').onsubmit=async event=>{const button=event.currentTarget.querySelector('button[type="submit"]');event.preventDefault();$('authError').textContent='';button.disabled=true;button.classList.add('busy');button.textContent='Входим…';try{const data=await request('/activate',{code:$('code').value.trim()});token=data.device_token;localStorage.setItem(storageKey(),token);await boot()}catch(error){$('authError').textContent=error.message}finally{button.classList.remove('busy');button.textContent='Активировать';button.disabled=false}};
  $('send').onclick=async()=>{const text=$('message').value.trim(),attachment={attachment_url:$('message').dataset.attachmentUrl||'',attachment_type:$('message').dataset.attachmentType||''};if(!text&&!attachment.attachment_url||!active)return;$('send').disabled=true;$('send').classList.add('busy');$('send').textContent='Отправляем…';try{const result=await sendText(text,$('sendAll').checked?cardChannels:[active],attachment);if(result.sent.length||result.queued.length){$('message').value='';sizeMessageInput();delete $('message').dataset.attachmentUrl;delete $('message').dataset.attachmentType;$('more').title=''}messageSignature='';await refreshActive(true);showError(result.status)}catch(error){showError(error.message)}finally{$('send').classList.remove('busy');$('send').textContent='Отправить';if(!$('message').disabled)$('send').disabled=false}};
  setInterval(refreshActive,5000);addEventListener('resize',()=>{showActiveChannel();sizeMessageInput()});addEventListener('message',event=>{if(event.source!==parent||!event.data||event.data.type!=='nexus-messenger-context')return;context=event.data.context;boot()});parent.postMessage({type:'nexus-messenger-ready'},'*');
})();
