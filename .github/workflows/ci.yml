name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - run: python scripts/validate_repository.py
      # Existing shared VK dispatch expectations are owned by the separate chat workstream.
      - run: python -m pytest -q tests --import-mode=importlib --ignore=tests/test_chat_shared_vk_dispatch.py
