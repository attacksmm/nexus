<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Управление потоками — доступы</title>
  <style>
    :root{color-scheme:dark;font-family:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;--bg:#060606;--panel:#101010;--strong:#171717;--text:#f2f2f2;--muted:#bababa;--border:#2d2d2d;--mid:#3a3a3a;--accent:#f4f4f4;--accent-text:#080808;--ok:#9fe0aa;--ok-bg:#102417;--ok-bd:#315f3a;--bad:#ffc2ca}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-size:13px}button,input{font:inherit}.app{height:100%;display:grid;grid-template-rows:54px 46px minmax(0,1fr) 30px}.topbar,.toolbar,.status{display:flex;align-items:center;border-bottom:1px solid var(--border);background:var(--panel)}.topbar{justify-content:space-between;gap:10px;padding:7px 12px}.title{font-size:16px;font-weight:700}.meta,.status{color:var(--muted);font-size:12px}.toolbar{justify-content:space-between;padding:6px 10px}.btn{min-height:34px;padding:7px 11px;border:1px solid var(--mid);border-radius:1px;background:var(--strong);color:var(--text);text-decoration:none;cursor:pointer}.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}.table-wrap{min-height:0;overflow:auto;scrollbar-color:#333 #0b0b0b}table{width:100%;border-collapse:collapse;table-layout:fixed}th{position:sticky;top:0;height:36px;padding:7px 10px;border-bottom:1px solid var(--mid);background:var(--panel);color:var(--muted);font-size:11px;text-align:left;text-transform:uppercase}td{height:48px;padding:7px 10px;border-bottom:1px solid var(--border);overflow-wrap:anywhere}tbody tr:hover{background:#0d0d0d}.badge{display:inline-flex;padding:2px 6px;border:1px solid var(--mid);font-size:11px}.badge.ok{color:var(--ok);border-color:var(--ok-bd);background:var(--ok-bg)}.status{padding:0 10px;border-top:1px solid var(--border);border-bottom:0}.empty{padding:32px;text-align:center;color:var(--muted)}dialog{width:min(520px,calc(100vw - 24px));padding:0;border:1px solid var(--mid);border-radius:1px;background:var(--panel);color:var(--text)}dialog::backdrop{background:#000b}.dialog-head,.dialog-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border)}.dialog-foot{justify-content:flex-end;border-top:1px solid var(--border);border-bottom:0}.dialog-body{display:grid;gap:10px;padding:12px}.field{display:grid;gap:5px}.label{color:var(--muted);font-size:11px;text-transform:uppercase}.control{width:100%;height:35px;padding:7px 9px;border:1px solid var(--mid);background:#090909;color:var(--text)}.check{display:flex;align-items:center;gap:8px;min-height:35px}.check input{width:18px;height:18px}.error{color:var(--bad)}@media(max-width:620px){.app{grid-template-rows:48px 46px minmax(0,1fr) 30px}.title{font-size:14px}table,tbody,tr,td{display:block}thead{display:none}tr{padding:8px 10px;border-bottom:1px solid var(--border)}td{display:grid;grid-template-columns:88px minmax(0,1fr);gap:8px;height:auto;min-height:28px;padding:3px 0;border:0}td::before{content:attr(data-label);color:var(--muted);font-size:11px;text-transform:uppercase}td:last-child{display:block;padding-top:7px}td:last-child::before{display:none}}
  </style>
</head>
<body>
  <div class="app"><header class="topbar"><div><div class="title">Управление потоками</div><div class="meta">Доступы и состояние</div></div><a class="btn primary" href="/streams/" target="_blank" rel="noreferrer">Открыть</a></header><div class="toolbar"><strong>Операторы</strong><button class="btn" id="addBtn" type="button">Добавить</button></div><main class="table-wrap"><table><thead><tr><th style="width:34%">Логин</th><th style="width:34%">Имя</th><th style="width:16%">Статус</th><th style="width:16%"></th></tr></thead><tbody id="rows"></tbody></table></main><footer class="status" id="status">Загрузка…</footer></div>
  <dialog id="editor"><div class="dialog-head"><strong id="dialogTitle">Оператор</strong><button class="btn" id="closeBtn" type="button">Закрыть</button></div><div class="dialog-body"><label class="field"><span class="label">Логин</span><input class="control" id="login"></label><label class="field"><span class="label">Имя</span><input class="control" id="display"></label><label class="check"><input id="active" type="checkbox" checked><span>Активен</span></label><div class="error" id="error"></div></div><div class="dialog-foot"><button class="btn primary" id="saveBtn" type="button">Сохранить</button></div></dialog>
  <script>
    const API=new URL('../api',location.href).pathname.replace(/\/$/,'');const $=id=>document.getElementById(id);let items=[],selected=null;function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function api(path,options={}){const response=await fetch(API+path,{credentials:'same-origin',...options});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.detail||data.error||`HTTP ${response.status}`);return data}function setStatus(text){$('status').textContent=text}function render(){const box=$('rows');if(!items.length){box.innerHTML='<tr><td colspan="4"><div class="empty">Операторов нет</div></td></tr>';return}box.innerHTML=items.map((item,index)=>`<tr><td data-label="Логин"><strong>${esc(item.login)}</strong></td><td data-label="Имя">${esc(item.display_name||item.login)}</td><td data-label="Статус"><span class="badge ${item.active?'ok':''}">${item.active?'Активен':'Отключён'}</span></td><td><button class="btn" data-index="${index}" type="button">Изменить</button></td></tr>`).join('');box.querySelectorAll('button[data-index]').forEach(button=>button.onclick=()=>openEditor(items[Number(button.dataset.index)]))}async function load(){const data=await api('/admin/operators');items=data.items||[];render();setStatus(`Операторов: ${items.length}`)}function openEditor(item=null){selected=item?.id||null;$('dialogTitle').textContent=item?'Изменить оператора':'Добавить оператора';$('login').value=item?.login||'';$('display').value=item?.display_name||'';$('active').checked=item?!!item.active:true;$('error').textContent='';$('editor').showModal()}async function save(){const body={login:$('login').value.trim(),display_name:$('display').value.trim(),active:$('active').checked};if(!body.login)throw new Error('Введите логин');await api(selected?'/admin/operators/'+selected:'/admin/operators',{method:selected?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});$('editor').close();await load();setStatus('Сохранено')}$('addBtn').onclick=()=>openEditor();$('closeBtn').onclick=()=>$('editor').close();$('saveBtn').onclick=()=>save().catch(error=>$('error').textContent=error.message);load().catch(error=>setStatus(error.message));
  </script>
</body>
</html>
