<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; script-src 'self' 'sha256-tGFxNlA4Ybvm8SMtnbq7u5+5WyOPtD3/7k7zT42eQ5Q='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; form-action 'self'">
  <link rel="icon" href="data:,">
  <title>Управление потоками — доступы</title>
  <style>
    :root{color-scheme:dark;font-family:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;--bg:#060606;--panel:#101010;--strong:#171717;--text:#f2f2f2;--muted:#bababa;--border:#2d2d2d;--mid:#3a3a3a;--accent:#f4f4f4;--accent-text:#080808;--ok:#9fe0aa;--ok-bg:#102417;--ok-bd:#315f3a;--bad:#ffc2ca}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-size:13px}button,input{font:inherit}.app{height:100%;display:grid;grid-template-rows:54px 46px minmax(0,1fr) 30px}.topbar,.toolbar,.status{display:flex;align-items:center;border-bottom:1px solid var(--border);background:var(--panel)}.topbar{justify-content:space-between;gap:10px;padding:7px 12px}.title{font-size:16px;font-weight:700}.meta,.status{color:var(--muted);font-size:12px}.toolbar{justify-content:space-between;padding:6px 10px}.btn{min-height:34px;padding:7px 11px;border:1px solid var(--mid);border-radius:1px;background:var(--strong);color:var(--text);text-decoration:none;cursor:pointer}.btn:disabled{cursor:wait;opacity:.6}.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}.busy::before{content:"";width:12px;height:12px;margin-right:7px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.table-wrap{min-height:0;overflow:auto;scrollbar-color:#333 #0b0b0b}table{width:100%;border-collapse:collapse;table-layout:fixed}th{position:sticky;top:0;height:36px;padding:7px 10px;border-bottom:1px solid var(--mid);background:var(--panel);color:var(--muted);font-size:11px;text-align:left;text-transform:uppercase}td{height:48px;padding:7px 10px;border-bottom:1px solid var(--border);overflow-wrap:anywhere}tbody tr:hover{background:#0d0d0d}.badge{display:inline-flex;padding:2px 6px;border:1px solid var(--mid);font-size:11px}.badge.ok{color:var(--ok);border-color:var(--ok-bd);background:var(--ok-bg)}.status{padding:0 10px;border-top:1px solid var(--border);border-bottom:0}.status.busy::before{content:"";width:11px;height:11px;margin-right:7px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}.empty{padding:32px;text-align:center;color:var(--muted)}dialog{width:min(520px,calc(100vw - 24px));padding:0;border:1px solid var(--mid);border-radius:1px;background:var(--panel);color:var(--text)}dialog::backdrop{background:#000b}.dialog-head,.dialog-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border)}.dialog-foot{justify-content:flex-end;border-top:1px solid var(--border);border-bottom:0}.dialog-body{display:grid;gap:10px;padding:12px}.field{display:grid;gap:5px}.label{color:var(--muted);font-size:11px;text-transform:uppercase}.control{width:100%;height:35px;padding:7px 9px;border:1px solid var(--mid);background:#090909;color:var(--text)}.hint{color:var(--muted);font-size:11px;line-height:1.4}.check{display:flex;align-items:center;gap:8px;min-height:35px}.check input{width:18px;height:18px}.error{color:var(--bad)}@media(max-width:620px){.app{grid-template-rows:48px 46px minmax(0,1fr) 30px}.title{font-size:14px}table,tbody,tr,td{display:block}thead{display:none}tr{padding:8px 10px;border-bottom:1px solid var(--border)}td{display:grid;grid-template-columns:88px minmax(0,1fr);gap:8px;height:auto;min-height:28px;padding:3px 0;border:0}td::before{content:attr(data-label);color:var(--muted);font-size:11px;text-transform:uppercase}td:last-child{display:block;padding-top:7px}td:last-child::before{display:none}}
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar"><div><div class="title">Управление потоками</div><div class="meta">Доступы сотрудников управляются централизованно</div></div><a class="btn primary" href="/streams/" target="_blank" rel="noreferrer">Открыть Streams</a></header>
    <div class="toolbar"><strong>Сотрудники</strong></div>
    <main class="table-wrap"><div class="empty"><strong>Управление перенесено в единый реестр</strong><p>Создавайте операторов, меняйте логины, пароли и доступ к Streams в карточке сотрудника.</p><a class="btn primary" href="/nexus/staff-registry/panel/" target="_top">Открыть реестр сотрудников</a></div></main>
    <footer class="status">Локальное редактирование отключено</footer>
  </div>
</body>
</html>
