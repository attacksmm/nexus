  <div class="app">
    <aside class="sidebar" id="sidebar">

      <div class="sidebar-foot"><button class="theme-toggle" id="themeBtn" type="button" aria-label="Сменить тему" title="Сменить тему">Тёмная</button><strong id="operatorName">—</strong><button id="logoutBtn" type="button">Выйти</button></div>
    </aside>
    <main class="workspace">

  <div class="login" id="loginOverlay" hidden>
    <div class="login-box"><h1>Управление потоками</h1><p>Вход для сотрудников</p><form id="loginForm"><input class="field" id="loginInput" autocomplete="username" placeholder="Имя"><button class="btn primary" type="submit">Войти</button><div class="login-error" id="loginError"></div></form></div>
  </div>

  <dialog id="actionDialog"><div class="dialog-head"><h2 id="dialogTitle"></h2><button class="icon-btn" id="dialogClose" type="button" aria-label="Закрыть">×</button></div><div class="dialog-body" id="dialogBody"></div><div class="dialog-foot" id="dialogFoot"></div></dialog>

  <script>
    const trimmed=location.pathname.replace(/\/+$/,'');
    const API=trimmed.endsWith('/app')?trimmed.slice(0,-4):trimmed;
    const $=id=>document.getElementById(id);
    const state={operator:null,view:'students',students:[],curators:[],flows:[],flowStudents:[],selectedFlow:null,homeworkStudents:[],homeworkBusy:'',operations:[],summary:null,total:0,offset:0,limit:100,selectedId:'',setup:null,poll:null,loading:false,loadQueued:false,loadQueuedRefresh:false,access:{},accessChanges:{},accessBusy:'',accessTimer:null,lessonGuardUntil:0,sheetRows:{},chatDelivery:{}};
    const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    const json=body=>({method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const friendlyError=value=>/429|Too Many Requests/i.test(String(value||''))?'Google занят. Обновление продолжится автоматически':String(value||'Ошибка');
    async function api(path,options={}){const response=await fetch(API+path,{credentials:'same-origin',...options});const raw=await response.text();let data={};try{data=raw?JSON.parse(raw):{}}catch{data={detail:raw}}if(!response.ok)throw new Error(friendlyError(data.detail||data.error||`HTTP ${response.status}`));return data}
    function setStatus(text,kind=''){const el=$('statusText');el.textContent=text;el.style.color=kind==='bad'?'var(--bad)':kind==='ok'?'var(--ok)':''}
    function setRoute(params={},replace=false){const url=new URL(location.href);url.search='';if(params.client)url.search=`?client=${encodeURIComponent(params.client).replace(/%40/gi,'@')}`;else Object.entries(params).forEach(([key,value])=>value&&url.searchParams.set(key,value));history[replace?'replaceState':'pushState']({},'',url)}
    async function copyText(value){try{await navigator.clipboard.writeText(value)}catch{const input=document.createElement('textarea');input.value=value;input.style.position='fixed';input.style.opacity='0';document.body.append(input);input.select();document.execCommand('copy');input.remove()}setStatus('Ссылка скопирована','ok')}
    const flowUrl=flow=>{const url=new URL(location.href);url.search='';url.searchParams.set('flow',flowKey(flow));return url.href};
    const flowKey=f=>`${f.course_key}:${f.stream}`;
    const statusLabel=s=>({ready:'Готов',draft:'Черновик',assigned:'Назначен',pending:'Ожидает потока',queued:'В очереди',waiting:'Ожидает повтора',running:'Выполняется',completed:'Готово',warning:'Внимание',failed:'Ошибка',needs_delivery:'Нет доставки',manual:'Вручную'})[s]||s||'—';
    const stepStatus=value=>({not_linked:'не требуется',mirrored:'готово',updated:'готово',already_updated:'готово',created:'готово',completed:'готово',manual:'вручную'}[value?.status]||(value?.ok?'готово':value?.error?'ошибка':'ожидание'));
    const statusClass=s=>['ready','assigned','completed'].includes(s)?'ok':['draft','pending','queued','waiting','running','warning','needs_delivery'].includes(s)?'warn':s==='failed'?'bad':'';
    const tariffLabel=value=>({premium:'Премиум',vip:'ВИП','вип':'ВИП',standard:'Стандарт'})[String(value||'').trim().toLowerCase()]||value||'—';
    const tariffClass=value=>({premium:'tariff-premium',премиум:'tariff-premium',vip:'tariff-vip','вип':'tariff-vip',standard:'tariff-standard','стандарт':'tariff-standard'})[String(value||'').trim().toLowerCase()]||'';
    function setTheme(theme){const value=['light','gray','dark'].includes(theme)?theme:'dark';document.documentElement.dataset.theme=value;try{localStorage.setItem('nexus-streams-theme',value)}catch{}const button=$('themeBtn');if(button)button.textContent={light:'Светлая',gray:'Серая',dark:'Тёмная'}[value]}
    function cycleTheme(){const themes=['light','gray','dark'],current=document.documentElement.dataset.theme;setTheme(themes[(themes.indexOf(current)+1)%themes.length])}
    function closeMobile(){ $('sidebar').classList.remove('open') }
    function switchView(view,route=true,load=true){state.view=view;document.querySelectorAll('.nav button').forEach(button=>button.classList.toggle('active',button.dataset.view===view));['students','flows','homework','operations'].forEach(name=>$(name+'View').hidden=name!==view);$('pageTitle').textContent={students:'Клиенты',flows:'Потоки',homework:'Домашние задания',operations:'Операции'}[view];closeMobile();if(route)setRoute(view==='students'?{}:{view});if(load&&view==='operations')loadOperations();if(load&&view==='flows')loadFlows();if(view==='homework')renderHomeworkFilter()}
    function skeleton(){return Array.from({length:8},()=>'<tr>'+Array.from({length:6},()=>'<td><div class="skeleton"></div></td>').join('')+'</tr>').join('')}
    function query(refresh=false){const p=new URLSearchParams({offset:String(state.offset),limit:String(state.limit)});const values={q:$('searchInput').value.trim(),course_key:$('courseFilter').value,stream:$('streamFilter').value,tariff:$('tariffFilter').value,curator:$('curatorFilter').value};Object.entries(values).forEach(([key,value])=>value&&p.set(key,value));if(refresh)p.set('refresh','1');return p}
    function renderCuratorFilter(){const select=$('curatorFilter'),current=select.value;select.innerHTML='<option value="">Все кураторы</option>'+state.curators.map(item=>`<option value="${esc(item.value)}">${esc(item.name)}</option>`).join('');if(state.curators.some(item=>item.value===current))select.value=current}
    async function loadStudents(refresh=false){
      if(state.loading){state.loadQueued=true;state.loadQueuedRefresh=state.loadQueuedRefresh||refresh;return}
      state.loading=true;setStatus(refresh?'Синхронизация…':'Загрузка…');$('studentRows').innerHTML=skeleton();
      try{const data=await api('/students?'+query(refresh));state.students=data.items||[];state.curators=data.curators||[];state.summary=data.summary||null;state.total=Number(data.total||0);renderCuratorFilter();renderStudents();renderPager();document.querySelector('#studentsView .table-shell').scrollTop=0;if(state.selectedId)selectStudent(state.selectedId);setStatus(`Обновлено ${data.updated_at||''}`,'ok')}
      catch(error){$('studentRows').innerHTML=`<tr><td colspan="6"><div class="empty">${esc(error.message)}</div></td></tr>`;setStatus(error.message,'bad')}
      finally{state.loading=false;if(state.loadQueued){const queuedRefresh=state.loadQueuedRefresh;state.loadQueued=false;state.loadQueuedRefresh=false;loadStudents(queuedRefresh)}}
    }
    function renderStudents(){const box=$('studentRows');if(!state.students.length){box.innerHTML='<tr><td colspan="6"><div class="empty">Клиенты не найдены</div></td></tr>';return}box.innerHTML=state.students.map(item=>`<tr data-id="${esc(item.enrollment_id)}" class="${tariffClass(item.tariff)} ${item.enrollment_id===state.selectedId?'selected':''}"><td data-label="Клиент"><strong>${esc(item.name||'Без имени')}</strong><span class="cell-meta mono">${esc(item.gc_user_id||'ID не найден')}</span></td><td data-label="Email" data-wide>${esc(item.email)}${item.phone?`<span class="cell-meta mono">${esc(item.phone)}</span>`:''}${item.manager_name?`<span class="cell-meta">${esc(item.manager_name)}</span>`:''}</td><td data-label="Курс">${esc(item.course_display||item.course)}<span class="cell-meta">${esc(item.tariff?tariffLabel(item.tariff):'Тариф не найден')}</span></td><td data-label="Поток" class="mono">${esc(item.stream_display||item.stream||'—')}</td><td data-label="Куратор"><strong>${esc(item.curator_name||'—')}</strong><span class="cell-meta">${esc(item.curator||'')}</span></td><td data-label=""><button class="table-action" data-open="${esc(item.enrollment_id)}" type="button">Открыть</button></td></tr>`).join('');box.querySelectorAll('button[data-open]').forEach(button=>button.onclick=()=>openStudent(button.dataset.open));box.querySelectorAll('tr[data-id]').forEach(row=>row.onclick=event=>{if(!event.target.closest('button'))openStudent(row.dataset.id)})}
    function renderPager(){const from=state.total?state.offset+1:0,to=Math.min(state.offset+state.limit,state.total);$('pageText').textContent=`${from}–${to} из ${state.total}`;$('prevBtn').disabled=state.offset===0;$('nextBtn').disabled=state.offset+state.limit>=state.total;$('summaryBtn').disabled=!state.summary;$('summaryBtn').textContent=`Всего ${state.summary?.total??0}`}
    function showSummary(){const summary=state.summary||{},tariffs=summary.tariffs||{},curators=summary.vip_by_curator||[];openDialog('Сводка',`<div class="summary-grid"><div><span>Всего</span><strong>${Number(summary.total||0)}</strong></div><div><span>Стандарт</span><strong>${Number(tariffs.standard||0)}</strong></div><div><span>Премиум</span><strong>${Number(tariffs.premium||0)}</strong></div><div><span>ВИП</span><strong>${Number(tariffs.vip||0)}</strong></div></div><div class="summary-list">${curators.map(item=>`<div><span>${esc(item.name)}</span><strong>${Number(item.count||0)} ВИП</strong></div>`).join('')}</div>`,'')}
    function selectedStudent(){return state.students.find(item=>item.enrollment_id===state.selectedId)}
    async function openStudent(id,route=true){let item=state.students.find(value=>value.enrollment_id===id||String(value.email).toLowerCase()===String(id).toLowerCase());if(!item&&String(id).includes('@')){const data=await api('/students?'+new URLSearchParams({q:id,limit:'10'}));item=(data.items||[]).find(value=>String(value.email).toLowerCase()===String(id).toLowerCase())}if(!item){const data=await api(`/students/${encodeURIComponent(id)}`);item=data.item;state.curators=data.curators||state.curators}if(!item)throw new Error('Клиент не найден');state.students=[item,...state.students.filter(value=>value.enrollment_id!==item.enrollment_id)];switchView('students',false);selectStudent(item.enrollment_id);if(route)setRoute({client:item.email||item.enrollment_id})}
    function closeStudent(route=true){state.selectedId='';$('inspector').classList.remove('open');renderStudents();if(route)setRoute()}
    function progressGroups(list){const used=new Set(),stages=[];list.forEach((lesson,index)=>{const match=String(lesson.label||'').trim().match(/^(?:вип|vip)\s*(\d+)$/i);if(!match)return;const number=Number(match[1]),next=list.findIndex((candidate,i)=>i>index&&/^(?:вип|vip)\s*\d+$/i.test(String(candidate.label||'').trim())),end=next<0?list.length:next,accepted=list.slice(index+1,end).find(candidate=>new RegExp(`^${number}(?:[.,]0)?$`).test(String(candidate.label||'').trim()));used.add(lesson.key);if(accepted)used.add(accepted.key);stages.push({label:String(number),issued:lesson,accepted})});const reviews=list.filter(lesson=>!used.has(lesson.key)&&/отзыв/i.test(String(lesson.label||'')));if(reviews.length){reviews.slice(0,2).forEach(lesson=>used.add(lesson.key));stages.push({label:'Отзыв',issued:reviews[0],accepted:reviews[1]})}const service=list.filter(lesson=>!used.has(lesson.key)&&/(купивш|чат)/i.test(String(lesson.label||'')));return{stages,service}}
    function progressButton(lesson,label){return lesson?`<button class="progress-cell ${lesson.value?'done':''}" data-lesson="${esc(lesson.key)}" type="button" title="${esc(label)}" aria-label="${esc(label)}" aria-pressed="${lesson.value?'true':'false'}">${lesson.value?'✓':'·'}</button>`:'<span class="progress-cell empty">—</span>'}
    function serviceButton(lesson){return`<button class="service-mark ${lesson.value?'done':''}" data-lesson="${esc(lesson.key)}" type="button" aria-pressed="${lesson.value?'true':'false'}">${lesson.value?'✓ ':''}${esc(lesson.label)}</button>`}
    async function ensureSheetRow(item){if(Number(item.row||0)||state.sheetRows[item.enrollment_id])return;state.sheetRows[item.enrollment_id]='loading';try{const result=await api(`/students/${encodeURIComponent(item.enrollment_id)}/sheet-row`,{method:'POST'});item.row=Number(result.row||0);item.sheet_title=result.sheet_title||item.sheet_title;item.lessons=result.lessons||[];state.sheetRows[item.enrollment_id]='done';setStatus('Добавлен в таблицу','ok')}catch(error){item.sheet_error=error.message;state.sheetRows[item.enrollment_id]='error';setStatus(error.message,'bad')}if(state.selectedId===item.enrollment_id)selectStudent(item.enrollment_id)}
    async function toggleLesson(item,key){if(Date.now()<state.lessonGuardUntil)return;const lesson=(item.lessons||[]).find(value=>value.key===key);if(!lesson)return;const button=$('inspector').querySelector(`[data-lesson="${CSS.escape(key)}"]`);if(button)button.disabled=true;try{const result=await api(`/students/${encodeURIComponent(item.enrollment_id)}/lessons/${encodeURIComponent(key)}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({value:!lesson.value,expected_value:Boolean(lesson.value)})});lesson.value=Boolean(result.value);selectStudent(item.enrollment_id);setStatus('Таблица обновлена','ok')}catch(error){if(button)button.disabled=false;setStatus(error.message,'bad')}}
    const accessPackageLabel=value=>({standard:'Стандарт',premium:'Премиум',vip:'ВИП',mentorship:'Наставничество',module_standard:'Помодульно'})[value]||value;
    const accessValue=(item,draft)=>Object.hasOwn(draft,item.group_id)?draft[item.group_id]:Boolean(item.enabled);
    function accessStamp(value){if(!value)return'—';const date=new Date(value);return Number.isNaN(date.valueOf())?value:date.toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'})}
    function accessTime(value){if(!value)return'скоро';const date=new Date(value);return Number.isNaN(date.valueOf())?'скоро':date.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}
    function scheduleAccessCheck(item,data){clearTimeout(state.accessTimer);state.accessTimer=null;if(!data?.pending||!data.next_check_at)return;const delay=Math.max(15000,Math.min(3600000,new Date(data.next_check_at).valueOf()-Date.now()+15000));state.accessTimer=setTimeout(()=>{if(state.selectedId===item.enrollment_id)loadAccess(item,true)},delay)}
    function accessChip(item,label,draft,busy){const on=accessValue(item,draft),changed=Object.hasOwn(draft,item.group_id)&&Boolean(item.enabled)!==on;return`<button class="access-chip ${on?'on':''} ${changed?'changed':''}" data-access-group="${esc(item.group_id)}" type="button" title="${esc(item.name)}" aria-pressed="${on?'true':'false'}" ${busy?'disabled':''}>${esc(label)}</button>`}
    function renderAccess(item){const box=$('accessPanel');if(!box)return;const data=state.access[item.enrollment_id],draft=state.accessChanges[item.enrollment_id]||{},busy=state.accessBusy===item.enrollment_id;if(!data||data.loading){box.innerHTML='<div class="access-loading">Получаем группы…</div>';return}if(!data.ok){box.innerHTML=`<div class="notice ${data.refresh_due?'warn':'bad'}">${esc(data.error||'Группы не получены')}</div><div class="access-foot"><span></span><button class="btn" id="accessRefreshBtn" type="button">Повторить</button></div>`;$('accessRefreshBtn').onclick=()=>loadAccess(item,true);scheduleAccessCheck(item,data);return}const locked=busy||data.pending,courseHtml=['puppy','dog'].map(course=>{const items=(data.items||[]).filter(value=>value.course_key===course),packages=items.filter(value=>value.group_kind==='package'),modules=items.filter(value=>value.group_kind==='module').sort((a,b)=>Number(a.module_index)-Number(b.module_index));return`<div class="access-course"><div class="access-course-head"><strong>${course==='puppy'?'Щенок':'Собака'}</strong></div><div class="access-row"><span>Тариф</span><div class="access-options">${packages.map(value=>accessChip(value,accessPackageLabel(value.package_key),draft,locked)).join('')||'—'}</div></div><div class="access-row"><span>Модули</span><div class="access-options">${modules.map(value=>accessChip(value,String(value.module_index),draft,locked)).join('')||'—'}</div></div></div>`}).join('');const changed=Object.keys(draft).length,source=data.refreshing?'Обновление…':data.source==='live'?'GetCourse':'Снимок',budget=data.requests_left_2h==null?'':` · API ${data.requests_left_2h}`,notice=data.pending?`<div class="notice info">Запрос принят · проверка в очереди до ${esc(accessTime(data.next_check_at))}</div>`:data.warning?`<div class="notice warn">${esc(data.warning)}</div>`:'';box.innerHTML=`${notice}<div class="access-grid">${courseHtml}</div><div class="access-foot"><span>${source} ${esc(accessStamp(data.u     async function confirmCurator(item){const curator=$('targetCurator').value;if(!curator)return dialogNotice('Выберите куратора');const button=$('confirmCuratorBtn');button.disabled=true;try{const result=await api('/curator-changes',json({...baseRef(item),curator}));watchTransfer(result.id)}catch(error){button.disabled=false;dialogNotice(error.message)}}
    function openTransfer(item){const options=state.flows.filter(flow=>flow.status==='ready'&&flowKey(flow)!==`${item.course_key}:${item.stream}`).map(flow=>`<option value="${esc(flowKey(flow))}">${esc(flow.course)} · поток ${esc(flow.stream)} · ${esc(flow.teacher||'куратор не назначен')}</option>`).join('');openDialog('Перенос ученика',`<div class="transfer-route"><div class="route-point"><span>Сейчас</span><strong>${esc(item.course)} · поток ${esc(item.stream)}</strong></div><div class="route-arrow">→</div><div class="route-point"><span>После переноса</span><strong id="targetFlowLabel">Выберите поток</strong></div></div><div class="form"><label class="full">Ученик<input class="field" value="${esc(item.name||item.email)}" disabled></label><label class="full">Поток<select class="control" id="targetFlow"><option value="">Выберите поток</option>${options}</select></label></div><div id="dialogNotice"><div class="notice">Сначала проверьте перенос.</div></div>`,`<button class="btn" id="previewTransferBtn" type="button">Проверить перенос</button><button class="btn primary" id="confirmTransferBtn" type="button" disabled>Подтвердить перенос</button>`);$('targetFlow').onchange=()=>{const flow=state.flows.find(value=>flowKey(value)===$('targetFlow').value);$('targetFlowLabel').textContent=flow?`${flow.course} · поток ${flow.stream}`:'Выберите поток';$('confirmTransferBtn').disabled=true;state.preview=null};$('previewTransferBtn').onclick=()=>previewTransfer(item);$('confirmTransferBtn').onclick=()=>confirmTransfer(item)}
    async function previewTransfer(item){const target=state.flows.find(flow=>flowKey(flow)===$('targetFlow').value);if(!target)return dialogNotice('Выберите поток');const button=$('previewTransferBtn'),confirm=$('confirmTransferBtn');button.disabled=true;button.classList.add('busy');button.textContent='Проверяем…';confirm.disabled=true;$('dialogNotice').innerHTML='<div class="notice warn busy">Проверяем</div>';try{const preview=await api('/preview',json({...baseRef(item),target_course_key:target.course_key,target_stream:target.stream,move_sheet_row:true}));state.preview=preview;const ready=preview.action==='registry_repair'?'Только таблица':'Можно выполнить',sheetTitle=preview.sheet?.title||`${item.course_key==='puppy'?'Щ':'С'}${item.stream}`,sheet=preview.sheet?.found?`Таблица: ${esc(sheetTitle)}, строка ${Number(preview.sheet.row)}`:'В таблице не найден';$('dialogNotice').innerHTML=`<div class="notice ${preview.can_transfer?'ok':'bad'}">${preview.can_transfer?ready:esc((preview.blockers||[]).join(' · '))}</div><div class="notice info sheet-result"><span>${sheet}</span><label><input id="moveSheetRow" type="checkbox" checked>Перенести</label></div>`+(preview.warnings||[]).map(text=>`<div class="notice warn">${esc(text)}</div>`).join('');$('moveSheetRow').onchange=()=>{state.preview.sheet.move=$('moveSheetRow').checked};confirm.disabled=!preview.can_transfer}catch(error){dialogNotice(error.message)}finally{button.disabled=false;button.classList.remove('busy');button.textContent='Проверить перенос'}}
    async function confirmTransfer(item){if(!state.preview?.can_transfer)return;const button=$('confirmTransferBtn'),preview=$('previewTransferBtn');button.disabled=true;button.classList.add('busy');button.textContent='Запускаем…';preview.disabled=true;try{const result=await api('/transfers',json({...baseRef(item),target_course_key:state.preview.target.course_key,target_stream:state.preview.target.stream,move_sheet_row:$('moveSheetRow')?.checked!==false}));watchTransfer(result.id)}catch(error){button.disabled=false;button.classList.remove('busy');button.textContent='Подтвердить перенос';preview.disabled=false;dialogNotice(error.message)}}
    async function watchTransfer(id){$('dialogFoot').innerHTML='';const tick=async()=>{try{const item=await api('/transfers/'+id),active=['queued','waiting','running'].includes(item.status),retry=['failed','warning','needs_delivery'].includes(item.status),stateNote=item.status==='queued'?'Запрос принят. Выполнение начнётся автоматически.':item.status==='waiting'?'Запрос сохранён и повторится автоматически.':item.status==='running'?'Задача выполняется.':'';$('dialogBody').innerHTML=`<div class="notice ${statusClass(item.status)} ${active?'busy':''}">${esc(statusLabel(item.status))}</div>${stateNote?`<div class="notice info">${stateNote}</div>`:''}${item.error?`<div class="notice warn">${esc(item.error)}</div>`:''}<div class="facts" style="margin-top:16px">${Object.entries(item.steps||{}).filter(([key])=>!['preview','retry'].includes(key)).map(([key,value])=>`<div class="fact"><span>${esc({getcourse:'GetCourse',curator_order:'Процесс',registry:'Реестр',sheet:'Таблица',chat_removal:'Старые чаты'}[key]||key)}</span><span>${esc(stepStatus(value))}</span></div>`).join('')}</div>`;$('dialogFoot').innerHTML=retry?'<button class="btn primary" id="retryTransferBtn" type="button">Повторить</button>':'';const retryButton=$('retryTransferBtn');if(retryButton)retryButton.onclick=async()=>{retryButton.disabled=true;retryButton.classList.add('busy');await api(`/transfers/${id}/retry`,{method:'POST'});watchTransfer(id)};if(!active){clearInterval(state.poll);await Promise.all([loadStudents(),loadFlows(),loadOperations()])}}catch(error){clearInterval(state.poll);dialogNotice(error.message)}};await tick();state.poll=setInterval(tick,1800)}
    function nextStream(course){return Math.max(0,...state.flows.filter(flow=>flow.course_key===course).map(flow=>Number(flow.stream)||0))+1}
    async function openCreateFlow(){if(!state.setup)state.setup=await api('/flow-setup');const courses=(state.setup.courses||[]).map(course=>`<option value="${esc(course.key)}">${esc(course.title)}</option>`).join(''),teachers=(state.setup.teachers||[]).filter(teacher=>teacher.offer_id).map(teacher=>`<option value="${teacher.id}">${esc(teacher.name)}</option>`).join('');openDialog('Создать поток',`<div class="form"><label>Курс<select class="control" id="newCourse">${courses}</select></label><label>Номер<input class="field" id="newStream" inputmode="numeric"></label><label>Дата старта<input class="field" id="newDate" type="date"></label><label>Учитель<select class="control" id="newTeacher">${teachers}</select></label></div><div class="notice">Активация — после обеих ссылок.</div><div id="dialogNotice"></div>`,`<button class="btn primary" id="confirmFlowBtn" type="button">Создать</button>`);const updateNumber=()=>{$('newStream').value=nextStream($('newCourse').value)};$('newCourse').onchange=updateNumber;updateNumber();$('confirmFlowBtn').onclick=createFlow}
    async function createFlow(){const body={course_key:$('newCourse').value,stream:$('newStream').value.trim(),date_start:$('newDate').value,teacher_id:Number($('newTeacher').value)};if(!body.stream||!body.date_start)return dialogNotice('Заполните номер и дату');try{const job=await api('/flows',json(body));$('dialogBody').innerHTML='<div class="notice warn">Создание запущено. Чаты могут создаваться несколько минут.</div>';$('dialogFoot').innerHTML='';watchFlowJob(job.id)}catch(error){dialogNotice(error.message)}}
    async function watchFlowJob(id){const tick=async()=>{try{const job=await api('/flows/jobs/'+id),stateNote=job.status==='queued'?'Запрос принят. Выполнение начнётся автоматически.':job.status==='running'?'Задача выполняется.':'';$('dialogBody').innerHTML=`<div class="notice ${statusClass(job.status)}">${esc(statusLabel(job.status))}</div>${stateNote?`<div class="notice info">${stateNote}</div>`:''}${job.error?`<div class="notice bad">${esc(job.error)}</div>`:''}`;if(!['queued','running'].includes(job.status)){clearInterval(state.poll);await Promise.all([loadFlows(true),loadOperations()])}}catch(error){clearInterval(state.poll);dialogNotice(error.message)}};await tick();state.poll=setInterval(tick,2500)}
    function openVkLink(flow){openDialog('VK-ссылка',`<div class="form"><label class="full">Поток<input class="field" value="${esc(flow.course)} · ${esc(flow.stream)}" disabled></label><label class="full">Ссылка<input class="field mono" id="vkLink" placeholder="https://vk.me/join/..."></label></div><div id="dialogNotice"></div>`,`<button class="btn primary" id="saveVkBtn" type="button">Сохранить</button>`);$('saveVkBtn').onclick=async()=>{try{await api(`/flows/${flow.course_key}/${flow.stream}/vk-link`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({link:$('vkLink').value.trim()})});$('actionDialog').close();await loadFlows(true);setStatus('VK-ссылка сохранена','ok')}catch(error){dialogNotice(error.message)}}}
    async function loadOperations(){try{const [transfers,jobs]=await Promise.all([api('/transfers'),api('/flows/jobs')]);state.operations=[...(transfers.items||[]).map(item=>({...item,kind:'transfer'})),...(jobs.items||[]).map(item=>({...item,kind:'flow'}))].sort((a,b)=>String(b.updated_at).localeCompare(String(a.updated_at)));renderOperations()}catch(error){setStatus(error.message,'bad')}}
    function renderOperations(){const box=$('operationRows');if(!state.operations.length){box.innerHTML='<tr><td colspan="5"><div class="empty">Операций пока нет</div></td></tr>';return}box.innerHTML=state.operations.map(item=>`<tr><td data-label="Объект"><strong>${esc(item.kind==='flow'?`${item.course_key} · ${item.stream}`:(item.student_name||item.email))}</strong></td><td data-label="Действие">${esc(item.kind==='flow'?'Создание потока':(item.action==='curator_change'?'Смена куратора':'Перенос'))}</td><td data-label="Статус"><span class="badge ${statusClass(item.status)}">${esc(statusLabel(item.status))}</span></td><td data-label="Оператор">${esc(item.operator_name||'—')}</td><td data-label="Обновлено" class="mono"><span class="cell-meta">${esc(item.updated_at||'')}</span>${item.kind==='transfer'?`<button class="table-action" data-operation="${esc(item.id)}" type="button">Открыть</button>`:''}</td></tr>`).join('');box.querySelectorAll('[data-operation]').forEach(button=>button.onclick=()=>{openDialog('Операция','');watchTransfer(button.dataset.operation)})}
    async function applyRoute(){const params=new URLSearchParams(location.search),client=params.get('client'),flowParam=params.get('flow'),view=params.get('view');if(client){await openStudent(client,false);return}if(view==='homework'){switchView('homework',false);renderHomeworkFilter();$('homeworkFlowFilter').value=state.flows.some(flow=>flowKey(flow)===flowParam)?flowParam:'';await loadHomework(false,false);return}if(flowParam){const flow=state.flows.find(item=>flowKey(item)===flowParam);if(flow){await openFlow(flow,false);return}}if(view==='flows'){closeFlow(false);switchView('flows',false);return}if(view==='operations'){switchView('operations',false);return}closeStudent(false);switchView('students',false)}
    async function boot(){const me=await api('/me');if(!me.authenticated){$('loginOverlay').hidden=false;return}state.operator=me.operator;$('operatorName').textContent=me.operator.display_name;$('loginOverlay').hidden=true;await Promise.all([loadFlows(),loadStudents(),loadOperations()]);await applyRoute();setStatus('Готово','ok')}
    $('actionDialog').addEventListener('close',()=>{state.lessonGuardUntil=Date.now()+700});
    let searchTimer;setTheme(document.documentElement.dataset.theme);$('themeBtn').onclick=cycleTheme;document.querySelectorAll('.nav button').forEach(button=>button.onclick=()=>{if(button.dataset.view==='students')closeStudent(false);if(button.dataset.view==='flows')closeFlow(false);switchView(button.dataset.view)});$('menuBtn').onclick=()=>$('sidebar').classList.toggle('open');$('flowBackBtn').onclick=()=>closeFlow();$('homeworkFlowFilter').onchange=()=>loadHomework();$('homeworkRefreshBtn').onclick=()=>loadHomework(true);$('searchInput').oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{state.offset=0;loadStudents()},250)};$('courseFilter').onchange=()=>{renderFlowFilter();state.offset=0;loadStudents()};['streamFilter','tariffFilter','curatorFilter'].forEach(id=>$(id).onchange=()=>{state.offset=0;loadStudents()});$('summaryBtn').onclick=showSummary;$('refreshBtn').onclick=()=>{state.offset=0;loadStudents(true).then(()=>loadFlows())};$('prevBtn').onclick=()=>{state.offset=Math.max(0,state.offset-state.limit);loadStudents()};$('nextBtn').onclick=()=>{state.offset+=state.limit;loadStudents()};$('createFlowBtn').onclick=()=>openCreateFlow().catch(error=>setStatus(friendlyError(error.message),'bad'));$('syncBtn').onclick=async()=>{try{setStatus('Синхронизация…');await api('/sync',{method:'POST'});await Promise.all([loadStudents(),loadFlows(),loadOperations()]);setStatus('Синхронизировано','ok')}catch(error){setStatus(friendlyError(error.message),'bad')}};$('dialogClose').onclick=()=>{$('actionDialog').close();clearInterval(state.poll)};$('logoutBtn').onclick=async()=>{await api('/logout',{method:'POST'});location.reload()};$('loginForm').onsubmit=async event=>{event.preventDefault();try{await api('/login',json({login:$('loginInput').value.trim()}));$('loginError').textContent='';await boot()}catch(error){$('loginError').textContent=friendlyError(error.message)}};window.onpopstate=()=>applyRoute().catch(error=>setStatus(friendlyError(error.message),'bad'));document.addEventListener('visibilitychange',()=>{if(document.hidden&&state.poll){clearInterval(state.poll);state.poll=null}});boot().catch(error=>setStatus(friendlyError(error.message),'bad'));
  </script>
