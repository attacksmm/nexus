server {
    listen 80;
    server_name junior.sobakovod.pro;
    access_log /var/log/nginx/access.log nexus_safe;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name junior.sobakovod.pro;
    access_log /var/log/nginx/access.log nexus_safe;

    ssl_certificate     /etc/letsencrypt/live/junior.sobakovod.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/junior.sobakovod.pro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = / {
        return 301 /nexus/;
    }

    location = /streams {
        return 301 /streams/;
    }

    location /streams/ {
        proxy_pass         http://127.0.0.1:8080/student-transfer/api/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Prefix /streams;
        proxy_http_version 1.1;
        proxy_buffering    off;
        proxy_read_timeout 3600s;
    }

    # Senler stops subscribers on webhook 5xx. If Nexus is briefly unavailable
    # during a reboot/restart, return a safe variable payload instead of 502.
    location = /nexus/openrouter/api/senler-chat {
        proxy_pass         http://127.0.0.1:8080/openrouter/api/senler-chat;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Prefix /nexus;
        proxy_http_version 1.1;
        client_max_body_size 0;
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_body_timeout 3600s;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @senler_openrouter_fallback;
    }

    location @senler_openrouter_fallback {
        internal;
        default_type application/json;
        add_header X-Nexus-Fallback "senler-openrouter-unavailable" always;
        return 200 '{"vars":[{"n":"ai_answer","v":"Передала ваш вопрос специалисту. Скоро вернёмся с ответом."}],"glob_vars":[],"senler_fallback":true}';
    }

    location /nexus/ {
        proxy_pass         http://127.0.0.1:8080/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Prefix /nexus;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        client_max_body_size 0;
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_body_timeout 3600s;
    }
}
